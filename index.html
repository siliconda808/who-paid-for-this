<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misogyny in Science</title>

<style>
    body {
        font-family: Arial, sans-serif;
        color: #222;
        background: white;
        max-width: 850px;
        margin: 60px auto;
        padding: 0 24px;
        line-height: 1.6;
    }

    h1 {
        font-size: 32px;
        margin-bottom: 8px;
    }

    .intro {
        color: #666;
        margin-bottom: 35px;
    }

    #search {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin: 15px 0 25px;
    }

    .study {
        border-top: 1px solid #ddd;
        padding: 22px 0;
    }

    .study h2 {
        font-size: 19px;
        line-height: 1.4;
        margin: 0 0 8px;
    }

    .study h2 a {
        color: #222;
        text-decoration: none;
    }

    .study h2 a:hover {
        text-decoration: underline;
    }

    .metadata {
        color: #777;
        font-size: 13px;
        margin-bottom: 15px;
    }

    .summary {
        font-size: 14px;
        line-height: 1.75;
        white-space: pre-line;
    }

    .no-results {
        color: #777;
        padding: 20px 0;
    }
</style>
</head>

<body>

<header>
    <h1>Bad papers</h1>
    <p class="intro">
        We funded this instead of actual research on women's health.
    </p>
</header>

<main>

    <input
        type="search"
        id="search"
        placeholder="Search papers or authors..."
        aria-label="Search papers"
    >

    <div id="studies"></div>

</main>

<script>

// ==========================================
// ADD PAPERS HERE
// Copy an entry and fill in the information.
// ==========================================

const studies = [

    {
        title: "Does Endometriosis Affect Sexual Activity and Satisfaction of the Man Partner? A Comparison of Partners From Women Diagnosed With Endometriosis and Controls",
        authors: "Silvan Hämmerli, Alexandra Sabrina Kohl Schwartz, Kirsten Geraedts, Patrick Imesch, Martina Rauchfuss, Monika Maria Wölfler, Felix Haeberlin, Stefanie von Orelli, Markus Eberhard, Bruno Imthurn, Brigitte Leeners",
        year: "2018",
        journal: "Journal of Sexual Medicine",
        summary: `Endometriosis-associated pain and dyspareunia influence female sexuality, but little is known about men's experiences in affected couples. Despite the fact that both partners of endometriosis patients and of control women largely reported high sexual satisfaction, there are challenges for some couples that arise in the context of a sexual relationship when one partner has endometriosis. Challenges such as sexuality-related pain or a reduced frequency of sexual activities should be addressed by health care professionals to ameliorate any current difficulties and to prevent the development or aggravation of sexual dysfunction.`,
        url: "https://pubmed.ncbi.nlm.nih.gov/29706579/"
    },

    {
        title: "Attractiveness of women with rectovaginal endometriosis: a case-control study",
        authors: "Paolo Vercellini, Laura Buggio, Edgardo Somigliana, Giussy Barbara, Paola Viganò, Luigi Fedele",
        year: "2013",
        journal: "Fertility and Sterility",
        summary: `Objective was to evaluate physical attractiveness in women with and without endometriosis. Found that women with rectovaginal endometriosis were judged to be more attractive than those in the two control groups. Moreover, they had a leaner silhouette, larger breasts, and an earlier coitarche.`,
        url: "https://pubmed.ncbi.nlm.nih.gov/22985951/"
    },
    
    {
        title: "A qualitative study on menopause described from the man's perspective",
        authors: "Seyhan Hidiroglu, Ozlem Tanriover, Pinar Ay, Melda Karavus",
        year: "2014",
        journal: "Journal of the Pakistan Medical Association",
        summary: `To look at menopause from men's point of view and to provide a better understanding of this phase to improve the care delivered to menopausal women. Interventions are needed to increase men's awareness regarding menopause in order to help these men to be able to better support their spouses so that they can both have a smooth transition into postmenopausal years.`,
        url: "https://pubmed.ncbi.nlm.nih.gov/25823183/"
    }

];


// ==========================================
// DISPLAY PAPERS
// ==========================================

function escapeHTML(text) {
    return String(text ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function displayStudies() {

    const query = document
        .getElementById("search")
        .value
        .toLowerCase();

    const filtered = studies.filter(study => {

        const text = [
            study.title,
            study.authors,
            study.year,
            study.journal,
            study.summary
        ].join(" ").toLowerCase();

        return text.includes(query);
    });

    const container = document.getElementById("studies");

    if (filtered.length === 0) {
        container.innerHTML =
            '<p class="no-results">No papers found.</p>';
        return;
    }

    container.innerHTML = filtered.map(study => `

        <article class="study">

            <h2>
                <a href="${escapeHTML(study.url)}"
                   target="_blank"
                   rel="noopener noreferrer">
                    ${escapeHTML(study.title)}
                </a>
            </h2>

            <div class="metadata">
                ${escapeHTML(study.authors)}
                · ${escapeHTML(study.year)}
                · ${escapeHTML(study.journal)}
            </div>

            <div class="summary">
                ${escapeHTML(study.summary)}
            </div>

        </article>

    `).join("");
}


// ==========================================
// SEARCH
// ==========================================

document
    .getElementById("search")
    .addEventListener("input", displayStudies);


// Initial display
displayStudies();

</script>

</body>
</html>
